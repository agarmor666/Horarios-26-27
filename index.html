<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEIP Bartolomé Flores · Horarios 2026/27</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;color:#243447}.wrap{max-width:1400px;margin:auto;padding:18px}.shell{background:#fff;border-radius:22px;box-shadow:0 20px 60px #0002;overflow:hidden}header{padding:28px 26px 20px;text-align:center;background:linear-gradient(180deg,#fff,#f8fafc)}h1{margin:0;font-size:clamp(1.65rem,4vw,2.5rem)}header p{margin:8px 0 0;color:#64748b}.nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;background:#f1f5f9;border-top:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0}.nav button{border:0;background:#fff;color:#475569;padding:11px 16px;border-radius:11px;font-weight:700;cursor:pointer;box-shadow:0 1px 3px #0001}.nav button.active{background:#2563eb;color:#fff}main{padding:20px}.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) minmax(220px,2fr) auto;gap:10px;align-items:center;margin-bottom:18px}select,input,button.action{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;background:white;font:inherit}button.action{width:auto;cursor:pointer;font-weight:700}.title{font-size:1.35rem;font-weight:800;margin:0 0 12px}.hint{color:#64748b;margin:0 0 16px;font-size:.92rem}.table-wrap{overflow:auto;border:1px solid #dbe3ec;border-radius:14px;background:white}table{border-collapse:separate;border-spacing:0;width:100%;min-width:860px}th,td{border-right:1px solid #dbe3ec;border-bottom:1px solid #dbe3ec;padding:8px;vertical-align:top}th{background:#eef4ff;font-weight:800;text-align:center}th:first-child,td:first-child{border-left:0}.hour{white-space:nowrap;background:#f8fafc;width:110px}.slot{min-width:145px;height:68px}.card{border-radius:8px;padding:6px 7px;margin:0 0 5px;background:#f8fafc;border-left:4px solid #64748b;font-size:.82rem;line-height:1.25}.card:last-child{margin-bottom:0}.subj{font-weight:800;color:#1e293b}.meta{color:#475569;margin-top:3px}.dur{display:inline-block;margin-top:4px;padding:2px 6px;border-radius:999px;background:#e2e8f0;color:#334155;font-size:.72rem}.empty{color:#cbd5e1;text-align:center;padding-top:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{padding:20px;border-radius:14px;background:#f8fafc;border:1px solid #e2e8f0;text-align:center}.stat b{display:block;font-size:2rem;color:#2563eb}footer{padding:18px;text-align:center;color:#64748b;font-size:.88rem;background:#f8fafc}@media(max-width:760px){.wrap{padding:8px}main{padding:12px}.toolbar{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.nav{padding:10px}.nav button{flex:1 1 45%}}@media print{body{background:#fff}.wrap{max-width:none;padding:0}.shell{box-shadow:none}.nav,.toolbar,.hint,footer{display:none}main{padding:0}.table-wrap{border:0;overflow:visible}table{min-width:0;font-size:10px}}
</style>
</head>
<body>
<div class="wrap"><div class="shell">
<header><h1>CEIP BARTOLOMÉ FLORES</h1><p>Horario general del centro · Curso 2026/27</p></header>
<div class="nav"><button data-k="groups" class="active">👥 Grupos</button><button data-k="teachers">👨‍🏫 Profesorado</button><button data-k="subjects">📚 Materias</button><button data-k="stats">📊 Resumen</button></div>
<main>
<section id="viewer"><div class="toolbar"><select id="entity"></select><input id="search" type="search" placeholder="Buscar grupo, profesor o materia…"><button class="action" onclick="window.print()">🖨️ Imprimir</button></div><h2 class="title" id="title"></h2><p class="hint">Los bloques muestran la hora de inicio. La duración aparece indicada en cada actividad.</p><div class="table-wrap"><table id="tbl"></table></div></section>
<section id="stats" style="display:none"><h2 class="title">Resumen del horario</h2><div class="stats"><div class="stat"><b id="ng"></b>grupos</div><div class="stat"><b id="nt"></b>profesores</div><div class="stat"><b id="ns"></b>materias</div></div></section>
</main>
<footer>CEIP Bartolomé Flores · Mojácar · Horario generado con FET el 13/09/2026</footer>
</div></div>
<script src="meta.js"></script><script src="a0.js"></script><script src="a1.js"></script><script src="a2.js"></script><script src="a3.js"></script><script src="a4.js"></script><script src="a5.js"></script>
<script>
let kind='groups';const map={groups:['g','Grupos'],teachers:['t','Profesorado'],subjects:['s','Materias']};const sel=document.getElementById('entity'),search=document.getElementById('search'),tbl=document.getElementById('tbl'),title=document.getElementById('title');
function entities(){return H[map[kind][0]]}function fill(filter=''){const list=entities(),q=filter.toLocaleLowerCase('es'),old=sel.value;sel.innerHTML='';list.forEach((x,i)=>{if(!q||x.toLocaleLowerCase('es').includes(q)){const o=document.createElement('option');o.value=i;o.textContent=x;sel.appendChild(o)}});if([...sel.options].some(o=>o.value===old))sel.value=old;if(sel.options.length)render(+sel.value);else{title.textContent='Sin resultados';tbl.innerHTML=''}}
function fmtDur(n){return n===1?'30 min':n===2?'1 h':n===3?'1 h 30 min':(n/2)+' h'}function relevant(a,idx){if(kind==='groups')return a[5].includes(idx);if(kind==='teachers')return a[4].includes(idx);return a[3]===idx}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function card(a){const subj=H.s[a[3]],ts=a[4].map(i=>H.t[i]),gs=a[5].map(i=>H.g[i]);let meta='';if(kind==='groups')meta=ts.join(', ');else if(kind==='teachers')meta=gs.join(', ');else meta=[gs.join(', '),ts.join(', ')].filter(Boolean).join(' · ');return `<div class="card"><div class="subj">${esc(subj)}</div>${meta?`<div class="meta">${esc(meta)}</div>`:''}<span class="dur">${fmtDur(a[2])}</span></div>`}
function render(idx){const list=entities();if(!list[idx])return;title.textContent=map[kind][1]+' · '+list[idx];let out='<thead><tr><th></th>'+H.d.map(x=>`<th>${esc(x)}</th>`).join('')+'</tr></thead><tbody>';H.h.forEach((hr,hi)=>{out+=`<tr><th class="hour">${esc(hr)}</th>`;H.d.forEach((_,di)=>{const arr=H.a.filter(a=>a[0]===di&&a[1]===hi&&relevant(a,idx));out+=`<td class="slot">${arr.length?arr.map(card).join(''):'<div class="empty">—</div>'}</td>`});out+='</tr>'});tbl.innerHTML=out+'</tbody>'}
sel.addEventListener('change',()=>render(+sel.value));search.addEventListener('input',()=>fill(search.value));document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const k=b.dataset.k;if(k==='stats'){viewer.style.display='none';stats.style.display='block';return}viewer.style.display='block';stats.style.display='none';kind=k;search.value='';fill()}));ng.textContent=H.g.length;nt.textContent=H.t.length;ns.textContent=H.s.length;fill();
</script>
</body></html>
